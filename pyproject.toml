[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ra-st-difftem"
version = "0.1.0"
description = "Reliability-aware multi-receiver TEM denoising"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "PyWavelets>=1.4",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
calibration = ["scikit-learn==1.6.1", "joblib>=1.4"]

[tool.setuptools]
packages = ["models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
